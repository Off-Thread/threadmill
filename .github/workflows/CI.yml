name: CI

# Docs-only changes skip the build matrix; tag pushes always run everything
# (GitHub does not apply path filters to tag pushes).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'examples/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'examples/**'
      - '.gitignore'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: '5'
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macos-13 (last Intel runner) is retired — cross-compile x64 on the arm64 runner
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --platform --release --target x86_64-apple-darwin --js binding.js --dts binding.d.ts
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --platform --release --target aarch64-apple-darwin --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl --cross-compile --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: npx napi build --platform --release --target aarch64-unknown-linux-musl --cross-compile --js binding.js --dts binding.d.ts
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc --js binding.js --dts binding.d.ts
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: npx napi build --platform --release --target aarch64-pc-windows-msvc --js binding.js --dts binding.d.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - run: npm ci
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: threadmill.*.node
          if-no-files-found: error

  test-macos-windows:
    name: test - ${{ matrix.settings.target }}
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # x64 tests run under Rosetta on the arm64 runner (x64 Node via setup-node)
          - host: macos-latest
            target: x86_64-apple-darwin
            nodeArch: x64
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          architecture: ${{ matrix.settings.nodeArch || '' }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      # pretest self-installs the packed tarball into the root node_modules and
      # copies the downloaded .node binary into it, so tests (and test:types)
      # exercise the package exactly as installed from npm.
      - run: npm test
      - run: npm run test:types

  test-linux-gnu:
    name: test - ${{ matrix.settings.target }}
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      # pretest self-installs the packed tarball into the root node_modules and
      # copies the downloaded .node binary into it, so tests (and test:types)
      # exercise the package exactly as installed from npm.
      - run: npm test
      - run: npm run test:types

  test-linux-x64-musl:
    name: test - x86_64-unknown-linux-musl
    needs: build
    runs-on: ubuntu-latest
    container:
      image: node:lts-alpine
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: .
      # pretest self-installs the packed tarball into the root node_modules and
      # copies the downloaded .node binary into it, so tests (and test:types)
      # exercise the package exactly as installed from npm.
      - run: npm test
      - run: npm run test:types

  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - test-macos-windows
      - test-linux-gnu
      - test-linux-x64-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: npx napi artifacts
      # Publishes are resumable: already-published packages are skipped and 409s
      # (registry still processing a prior state) retry with backoff, so a rerun
      # of this job picks up wherever the previous attempt stopped.
      - name: Publish
        run: |
          EXTRA=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && EXTRA="--tag next"
          npx tsc -p tsconfig.json
          publish_one() {
            local dir="$1" name ver
            name=$(node -p "require('$2/package.json').name")
            ver=$(node -p "require('$2/package.json').version")
            if npm view "$name@$ver" version > /dev/null 2>&1; then
              echo "already published: $name@$ver"
              return 0
            fi
            for i in 1 2 3 4 5 6; do
              if npm publish $dir --access public --provenance $EXTRA; then
                return 0
              fi
              echo "retrying $name in 30s (attempt $i)"
              sleep 30
            done
            echo "giving up on $name"
            return 1
          }
          for d in npm/*/; do
            publish_one "./$d" "./$d"
          done
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const deps = {};
            for (const d of fs.readdirSync("npm")) {
              const pp = JSON.parse(fs.readFileSync(`npm/${d}/package.json`, "utf8"));
              deps[pp.name] = pp.version;
            }
            p.optionalDependencies = deps;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
          publish_one "--ignore-scripts" "."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
